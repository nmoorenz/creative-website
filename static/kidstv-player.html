<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Kids TV Player</title>
  <style>
    html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden}
    #player{position:absolute;top:0;left:0;width:100%;height:100%}
    #msg{position:absolute;top:0;left:0;right:0;color:#fff;font:16px sans-serif;padding:24px}
  </style>
</head>
<body>
  <!--
    Kids TV player page. Host on your website (Hugo/blogdown: put in `static/`
    so it is served at  https://YOUR-SITE/kidstv-player.html ).
    The app opens it as  ?v=VIDEOID&t=STARTSECONDS
  -->
  <div id="player"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    function qs(k){ return new URLSearchParams(location.search).get(k); }
    var VIDEO = qs('v') || '';
    var START = parseInt(qs('t') || '0', 10) || 0;
    var player;

    function br0(n){ try{ if(window.AndroidBridge && AndroidBridge[n]) AndroidBridge[n](); }catch(e){} }
    function br1(n,a){ try{ if(window.AndroidBridge && AndroidBridge[n]) AndroidBridge[n](a); }catch(e){} }
    function br2(n,a,b){ try{ if(window.AndroidBridge && AndroidBridge[n]) AndroidBridge[n](a,b); }catch(e){} }

    function onYouTubeIframeAPIReady(){
      if (!VIDEO){
        document.getElementById('player').outerHTML =
          '<div id="msg">No video specified. Add ?v=VIDEO_ID to the address.</div>';
        return;
      }
      player = new YT.Player('player', {
        width: '100%', height: '100%',
        videoId: VIDEO,
        playerVars: {
          autoplay: 1, controls: 1, rel: 0, fs: 0,
          modestbranding: 1, playsinline: 1, iv_load_policy: 3, start: START
        },
        events: {
          'onReady': function(e){ e.target.playVideo(); br0('onReady'); setInterval(tick, 1000); },
          'onStateChange': function(e){ br1('onState', e.data); },
          'onError': function(e){ br1('onError', e.data); }
        }
      });
    }

    function tick(){
      try {
        if (player && player.getDuration) {
          br2('onProgress', Math.floor(player.getCurrentTime()), Math.floor(player.getDuration()));
        }
      } catch(e){}
    }
  </script>
</body>
</html>
