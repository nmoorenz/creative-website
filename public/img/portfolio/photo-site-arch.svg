<svg width="100%" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: system-ui, sans-serif; }
      .th  { font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .ts  { font-size: 12px; font-weight: 400; fill: #666; }
      .arr { stroke: #aaa; stroke-width: 1; fill: none; }

      .box-gray   { fill: #f5f5f4; stroke: #ccc; }
      .box-teal   { fill: #e1f5ee; stroke: #5dcaa5; }
      .box-purple { fill: #eeedfe; stroke: #7f77dd; }
      .box-amber  { fill: #faeeda; stroke: #ef9f27; }

      .label-gray   { fill: #444; }
      .label-teal   { fill: #0f6e56; }
      .label-purple { fill: #3c3489; }
      .label-amber  { fill: #633806; }
      .sublabel-teal   { fill: #1d9e75; }
      .sublabel-purple { fill: #534ab7; }
      .sublabel-amber  { fill: #854f0b; }

      @media (prefers-color-scheme: dark) {
        .th  { fill: #e8e4de; }
        .ts  { fill: #7a7570; }
        .arr { stroke: #555; }

        .box-gray   { fill: #2a2a2a; stroke: #444; }
        .box-teal   { fill: #085041; stroke: #1d9e75; }
        .box-purple { fill: #26215c; stroke: #7f77dd; }
        .box-amber  { fill: #412402; stroke: #ba7517; }

        .label-gray   { fill: #ccc; }
        .label-teal   { fill: #9fe1cb; }
        .label-purple { fill: #cecbF6; }
        .label-amber  { fill: #fac775; }
        .sublabel-teal   { fill: #5dcaa5; }
        .sublabel-purple { fill: #afa9ec; }
        .sublabel-amber  { fill: #ef9f27; }
      }
    </style>
  </defs>

  <!-- ── Row 1: Browser + GitHub ── -->
  <rect x="40" y="40" width="140" height="56" rx="8" stroke-width="0.5" class="box-gray"/>
  <text x="110" y="62" text-anchor="middle" dominant-baseline="central" class="th label-gray">Browser</text>
  <text x="110" y="80" text-anchor="middle" dominant-baseline="central" class="ts">Visitor</text>

  <rect x="500" y="40" width="140" height="56" rx="8" stroke-width="0.5" class="box-gray"/>
  <text x="570" y="62" text-anchor="middle" dominant-baseline="central" class="th label-gray">GitHub</text>
  <text x="570" y="80" text-anchor="middle" dominant-baseline="central" class="ts">Source repository</text>

  <!-- ── Row 2: Netlify + photo_sync.py ── -->
  <rect x="40" y="180" width="140" height="56" rx="8" stroke-width="0.5" class="box-teal"/>
  <text x="110" y="202" text-anchor="middle" dominant-baseline="central" class="th label-teal">Netlify</text>
  <text x="110" y="220" text-anchor="middle" dominant-baseline="central" class="ts sublabel-teal">photos.example.com</text>

  <rect x="500" y="180" width="140" height="56" rx="8" stroke-width="0.5" class="box-gray"/>
  <text x="570" y="202" text-anchor="middle" dominant-baseline="central" class="th label-gray">photo_sync.py</text>
  <text x="570" y="220" text-anchor="middle" dominant-baseline="central" class="ts">Local CLI tool</text>

  <!-- ── Row 3: CloudFront ── -->
  <rect x="270" y="320" width="140" height="56" rx="8" stroke-width="0.5" class="box-purple"/>
  <text x="340" y="342" text-anchor="middle" dominant-baseline="central" class="th label-purple">CloudFront</text>
  <text x="340" y="360" text-anchor="middle" dominant-baseline="central" class="ts sublabel-purple">cdn.example.com</text>

  <!-- ── Row 4: S3 ── -->
  <rect x="270" y="440" width="140" height="56" rx="8" stroke-width="0.5" class="box-amber"/>
  <text x="340" y="462" text-anchor="middle" dominant-baseline="central" class="th label-amber">S3 bucket</text>
  <text x="340" y="480" text-anchor="middle" dominant-baseline="central" class="ts sublabel-amber">Private — photos + manifest</text>

  <!-- ── Arrows ── -->

  <!-- Browser → Netlify -->
  <line x1="110" y1="96" x2="110" y2="178" class="arr" marker-end="url(#arrow)"/>
  <text x="86" y="142" text-anchor="middle" class="ts">visits</text>

  <!-- GitHub → Netlify -->
  <path d="M500 68 L180 200" class="arr" marker-end="url(#arrow)"/>
  <text x="352" y="120" text-anchor="middle" class="ts">auto-deploy on push</text>

  <!-- Browser → CloudFront -->
  <path d="M180 208 Q270 208 270 340" class="arr" marker-end="url(#arrow)"/>
  <text x="196" y="288" text-anchor="start" class="ts">fetches photos</text>
  <text x="196" y="302" text-anchor="start" class="ts">+ manifest</text>

  <!-- photo_sync.py → S3 -->
  <path d="M500 236 Q500 468 412 468" class="arr" marker-end="url(#arrow)"/>
  <text x="508" y="370" text-anchor="start" class="ts">uploads photos</text>
  <text x="508" y="384" text-anchor="start" class="ts">+ manifest.json</text>

  <!-- CloudFront → S3 -->
  <line x1="340" y1="376" x2="340" y2="438" class="arr" marker-end="url(#arrow)"/>
  <text x="348" y="412" text-anchor="start" class="ts">reads via OAC</text>

</svg>
